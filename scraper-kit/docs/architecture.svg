  <rect class="bnd" x="200" y="64" width="480" height="308" rx="12"/>
  <text class="ts" x="664" y="82" text-anchor="end">scraper_kit</text>

  <path class="arr" d="M340 62 L330 80" marker-end="url(#mN)"/>
  <path class="arr" d="M380 62 L550 80" marker-end="url(#mN)"/>

  <rect class="node" x="228" y="84" width="200" height="52" rx="8"/>
  <text class="th" x="328" y="106" text-anchor="middle">SearchScraper</text>
  <text class="ts" x="328" y="124" text-anchor="middle">搜索 · URL 页码翻页</text>

  <rect class="node" x="452" y="84" width="200" height="52" rx="8"/>
  <text class="th" x="552" y="106" text-anchor="middle">DetailScraper</text>
  <text class="ts" x="552" y="124" text-anchor="middle">详情页 · 单页采集</text>

  <rect class="node-b" x="228" y="164" width="200" height="52" rx="8"/>
  <text class="th" x="328" y="186" text-anchor="middle">MySearchParser</text>
  <text class="ts" x="328" y="204" text-anchor="middle">★ 你来实现 (~10行)</text>

  <rect class="node-b" x="452" y="164" width="200" height="52" rx="8"/>
  <text class="th" x="552" y="186" text-anchor="middle">MyDetailParser</text>
  <text class="ts" x="552" y="204" text-anchor="middle">★ 你来实现 (~10行)</text>

  <path class="dash" d="M328 164 L328 140" marker-end="url(#mN)"/>
  <path class="dash" d="M552 164 L552 140" marker-end="url(#mN)"/>

  <rect class="grp" x="228" y="244" width="428" height="128" rx="8"/>
  <text class="th" x="244" y="266">TieredFetcher · 抓取引擎</text>
  <rect class="node" x="244" y="278" width="124" height="36" rx="8"/><text class="ct" x="306" y="301" text-anchor="middle">Tier1 curl_cffi</text>
  <rect class="node" x="378" y="278" width="132" height="36" rx="8"/><text class="ct" x="444" y="301" text-anchor="middle">Tier2 无头浏览器</text>
  <rect class="node" x="522" y="278" width="118" height="36" rx="8"/><text class="ct" x="581" y="301" text-anchor="middle">Tier3 手动兜底</text>
  <rect class="node" x="244" y="322" width="104" height="36" rx="8"/><text class="ct" x="296" y="347" text-anchor="middle">挑战检测</text>
  <rect class="node" x="360" y="322" width="104" height="36" rx="8"/><text class="ct" x="412" y="347" text-anchor="middle">随机限速</text>
  <rect class="node" x="476" y="322" width="136" height="36" rx="8"/><text class="ct" x="544" y="347" text-anchor="middle">Cookie 持久化</text>

  <path class="arr" d="M228 120 L214 120 L214 308 L224 308" marker-end="url(#mN)"/>
  <path class="arr" d="M652 120 L664 120 L664 308 L660 308" marker-end="url(#mN)"/>
  <path class="arr" d="M480 372 L480 394" marker-end="url(#mN)"/>

  <rect class="pill" x="400" y="398" width="160" height="48" rx="12"/>
  <text class="th" x="480" y="418" text-anchor="middle">目标视频网站</text>
  <text class="ts" x="480" y="436" text-anchor="middle">Cloudflare 防护</text>
