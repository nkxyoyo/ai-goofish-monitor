<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" font-family="'SF Pro Text','PingFang SC',system-ui,sans-serif">
  <style>
    .ct { fill: #171717; font: 400 14px/20px inherit; }
    .ts { fill: #52525B; font: 400 12px/18px inherit; }
    .th { fill: #171717; font: 500 14px/20px inherit; }
    .node { fill: #EFEFF2; stroke: rgba(23,23,23,0.12); }
    .node-b { fill: #F2F7FF; stroke: #4B3FE3; }
    .pill { fill: #EFEFF2; stroke: rgba(23,23,23,0.12); }
    .grp { fill: #F7F7F8; stroke: rgba(23,23,23,0.12); }
    .bnd { fill: none; stroke: rgba(23,23,23,0.12); stroke-dasharray: 6 5; }
    .arr { stroke: #52525B; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .arr-b { stroke: #4B3FE3; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke: #52525B; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; stroke-linecap: round; }
    .cap { fill: #F2F7FF; stroke: #4B3FE3; }
    .capt { fill: #1A1759; font: 500 12px/18px inherit; }
  </style>
  <defs>
    <marker id="mB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#4B3FE3"/></marker>
    <marker id="mN" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#52525B"/></marker>
  </defs>
  <rect width="720" height="478" fill="#F7F7F8"/>

  <rect class="pill" x="280" y="14" width="160" height="48" rx="12"/>
  <text class="th" x="360" y="34" text-anchor="middle">你的项目</text>
